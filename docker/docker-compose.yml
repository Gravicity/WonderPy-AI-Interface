version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: wonderpy_db
    environment:
      POSTGRES_DB: wonderpy_db
      POSTGRES_USER: wonderpy
      POSTGRES_PASSWORD: wonderpy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wonderpy"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: wonderpy_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: wonderpy_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://wonderpy:wonderpy_password@db:5432/wonderpy_db
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/app
      - /var/run/dbus:/var/run/dbus  # For Bluetooth access
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true  # Required for Bluetooth
    network_mode: host  # Required for Bluetooth

  # Frontend
  frontend:
    build:
      context: ..
      dockerfile: docker/frontend.Dockerfile
    container_name: wonderpy_frontend
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000

  # Nginx Reverse Proxy
  nginx:
    build:
      context: ..
      dockerfile: docker/nginx.Dockerfile
    container_name: wonderpy_nginx
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ../docker/nginx.conf:/etc/nginx/nginx.conf:ro

  # Prometheus (Monitoring)
  prometheus:
    image: prom/prometheus:latest
    container_name: wonderpy_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  # Grafana (Dashboards)
  grafana:
    image: grafana/grafana:latest
    container_name: wonderpy_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: wonderpy_network
